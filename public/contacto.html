<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <title>Contacto — Lucas Raboni</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <nav>
        <ul class="nav-links">
            <li><a href="/" data-i18n="nav.welcome">welcome</a></li>
            <li><a href="/sobre-mi" data-i18n="nav.sobre">sobre mí</a></li>
            <li><a href="/formacion" data-i18n="nav.formacion">formación</a></li>
            <li><a href="/habilidades" data-i18n="nav.habilidades">habilidades</a></li>
            <li><a href="/portfolio" data-i18n="nav.portfolio">portfolio</a></li>
            <li><a href="/contacto" class="active" data-i18n="nav.contacto">contacto</a></li>
        </ul>
        <div class="nav-icons">
            <a href="https://www.linkedin.com/in/lucas-raboni-71b012236/" target="_blank"><i class="fab fa-linkedin-in"></i></a>
            <a href="https://www.instagram.com/lucasraboni_/" target="_blank"><i class="fab fa-instagram"></i></a>
            <a href="mailto:lucasraboni7@gmail.com"><i class="far fa-envelope"></i></a>
        </div>
    </nav>

    <section class="hero hero-small">
        <div class="hero-slide active" style="background-image: url('/img/foto-mia-7.jpg')"></div>
        <div class="hero-content">
            <h1 class="hero-title" data-i18n="contact.hero">contacto</h1>
        </div>
    </section>

    <section class="page-section">
        <div class="contacto-grid">

            <div>
                <p class="col-title" data-i18n="contact.form.title">escribime</p>
                <form action="/contacto" method="POST">
                    <div class="form-group">
                        <label class="form-label" data-i18n="contact.label.name">nombre</label>
                        <input type="text" name="nombre" class="form-input" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label" data-i18n="contact.label.email">email</label>
                        <input type="email" name="email" class="form-input" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label" data-i18n="contact.label.message">mensaje</label>
                        <textarea name="mensaje" class="form-input form-textarea" required></textarea>
                    </div>
                    <button type="submit" class="form-btn" data-i18n="contact.btn">enviar mensaje</button>
                </form>
            </div>

            <div>
                <p class="col-title" data-i18n="contact.info.title">o encontrame en</p>
                <div class="info-item">
                    <span class="dato-label">email</span>
                    <span class="dato-valor">lucasraboni7@gmail.com</span>
                </div>
                <div class="info-item">
                    <span class="dato-label" data-i18n="sobre.ubicacion.label">ubicación</span>
                    <span class="dato-valor">San Andrés de Giles, Buenos Aires</span>
                </div>
                <div class="info-item">
                    <span class="dato-label" data-i18n="contact.avail.label">disponibilidad</span>
                    <span class="dato-valor" data-i18n="contact.avail.value">Abierto a oportunidades freelance</span>
                </div>
                <div class="contacto-social">
                    <a href="https://www.linkedin.com/in/lucas-raboni-71b012236/" target="_blank"><i class="fab fa-linkedin-in"></i></a>
                    <a href="https://www.instagram.com/lucasraboni_/" target="_blank"><i class="fab fa-instagram"></i></a>
                    <a href="mailto:lucasraboni7@gmail.com"><i class="far fa-envelope"></i></a>
                </div>
            </div>

        </div>
    </section>

    <footer>
        <div class="footer-icons">
            <a href="https://www.linkedin.com/in/lucas-raboni-71b012236/" target="_blank"><i class="fab fa-linkedin-in"></i></a>
            <a href="https://www.instagram.com/lucasraboni_/" target="_blank"><i class="fab fa-instagram"></i></a>
            <a href="mailto:lucasraboni7@gmail.com"><i class="far fa-envelope"></i></a>
        </div>
        <p class="footer-copy" data-i18n="footer.copy">All rights reserved | Lucas Raboni | 2026</p>
    </footer>

    <script src="/js/theme.js"></script>
    <script src="/js/i18n.js"></script>
</body>
</html>
